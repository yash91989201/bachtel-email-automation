services:
  app:
    build: .
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8090}:8090"
    # Application settings interpolated from the host .env file. Microsoft
    # tenant/application credentials are not deployment settings: each operator
    # saves their own provider setup in the UI.
    # MS_AUTHORITY_URL / MS_GRAPH_BASE_URL stay unset in production.
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_RESTORE_REVIEW: ${APP_RESTORE_REVIEW:-}
    volumes:
      - pb_data:/app/pb_data
    restart: unless-stopped
    # Bounded Graph requests take up to 20s; final persistence needs headroom.
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pb_data:
