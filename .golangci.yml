version: '2'

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - modernize
    - nolintlint
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
      # These concrete in-memory writers document an always-nil error.
      # Do not exempt generic io.Writer, HTTP responses, or file writes.
      exclude-functions:
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).Write
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
